<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hold the Line — Prototype</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111;color:#eee;font-family:Arial,Helvetica,sans-serif;overflow:hidden}
#game{position:relative;width:100vw;height:100vh;background:#171717}
canvas{display:block;width:100%;height:100%;cursor:crosshair}
#hud{position:absolute;top:0;left:0;right:0;padding:12px;display:flex;gap:8px;flex-wrap:wrap;pointer-events:none}
.stat{background:#222d;padding:8px 11px;border:1px solid #444;border-radius:8px;font-size:14px}
#crosshair{position:absolute;left:50%;top:50%;width:20px;height:20px;transform:translate(-50%,-50%);pointer-events:none}
#crosshair:before,#crosshair:after{content:"";position:absolute;background:#fff}
#crosshair:before{width:20px;height:2px;top:9px;left:0}.crosshair:after{height:20px;width:2px;left:9px;top:0}
#message{position:absolute;top:70px;left:50%;transform:translateX(-50%);background:#000b;padding:9px 14px;border-radius:8px}
#overlay{position:absolute;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px}
.panel{width:min(520px,92vw);background:#202020;border:1px solid #555;border-radius:14px;padding:28px}
h1{margin:0 0 8px;font-size:34px}p{line-height:1.5;color:#bbb}
button{background:#eee;color:#111;border:0;border-radius:8px;padding:12px 18px;font-weight:bold;font-size:15px;cursor:pointer;margin:5px}
button:hover{background:#ccc}
.upgrades{display:flex;justify-content:center;flex-wrap:wrap;margin-top:12px}
small{color:#666}
</style>
</head>
<body>
<div id="game">
<canvas id="canvas"></canvas>
<div id="hud">
<div class="stat">❤️ <b id="hp">100</b></div>
<div class="stat">💰 <b id="money">0</b></div>
<div class="stat">🌊 Wave <b id="wave">1</b></div>
<div class="stat">☠️ Kills <b id="kills">0</b></div>
<div class="stat">🔫 Damage <b id="damage">25</b></div>
</div>
<div id="crosshair"></div>
<div id="message">WASD move • Mouse aim • Click shoot</div>
<div id="overlay"><div class="panel">
<h1>HOLD THE LINE</h1>
<p>A quick browser prototype for a wave-defense shooter. Survive the attack, earn money, and upgrade your weapon.</p>
<button id="start">PLAY</button>
</div></div>
</div>
<script>
const canvas=document.getElementById("canvas"),ctx=canvas.getContext("2d");
let W=innerWidth,H=innerHeight,dpr=Math.min(devicePixelRatio||1,2);
function resize(){W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener("resize",resize);resize();

const keys={},mouse={x:W/2,y:H/2,down:false};
let player,enemies,bullets,particles,running=false,last=0,spawn=0,waveTime=0;
let wave,money,kills,hp,damage,fireDelay,lastShot=0;

function reset(){
 player={x:W/2,y:H/2,r:18,speed:300};
 enemies=[];bullets=[];particles=[];wave=1;money=0;kills=0;hp=100;damage=25;fireDelay=260;spawn=0;waveTime=0;
 hud();
}
function hud(){
 hpEl.textContent=Math.max(0,Math.ceil(hp));moneyEl.textContent=money;waveEl.textContent=wave;
 killsEl.textContent=kills;damageEl.textContent=damage;
}
const hpEl=document.getElementById("hp"),moneyEl=document.getElementById("money"),waveEl=document.getElementById("wave"),killsEl=document.getElementById("kills"),damageEl=document.getElementById("damage");
function mousePos(e){mouse.x=e.clientX;mouse.y=e.clientY}
canvas.addEventListener("mousemove",mousePos);
canvas.addEventListener("mousedown",e=>{if(e.button===0)mouse.down=true});
addEventListener("mouseup",()=>mouse.down=false);
addEventListener("keydown",e=>keys[e.key.toLowerCase()]=true);
addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);

function shoot(t){
 if(t-lastShot<fireDelay||!running)return;
 lastShot=t;
 const a=Math.atan2(mouse.y-player.y,mouse.x-player.x);
 bullets.push({x:player.x+Math.cos(a)*25,y:player.y+Math.sin(a)*25,vx:Math.cos(a)*850,vy:Math.sin(a)*850,r:4,d:damage});
}
function spawnEnemy(){
 const side=Math.floor(Math.random()*4),pad=35;let x,y;
 if(side===0){x=-pad;y=Math.random()*H}else if(side===1){x=W+pad;y=Math.random()*H}
 else if(side===2){x=Math.random()*W;y=-pad}else{x=Math.random()*W;y=H+pad}
 const boss=Math.random()<Math.min(.06+wave*.01,.18);
 const max=(40+wave*9)*(boss?3:1);
 enemies.push({x,y,r:boss?23:15,hp:max,max,speed:(65+wave*3)*(boss?.65:1),boss});
}
function burst(x,y,n=8){
 for(let i=0;i<n;i++){let a=Math.random()*Math.PI*2,s=40+Math.random()*180;
 particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.35})}
}
function clearWave(){
 running=false;mouse.down=false;
 document.querySelector("#overlay").style.display="flex";
 document.querySelector("#overlay .panel").innerHTML=`
 <h1>WAVE ${wave} CLEARED</h1>
 <p>You have <b>${money}</b> coins. Buy an upgrade before the next wave.</p>
 <div class="upgrades">
 <button data-u="damage">Damage +10<br><small>25 coins</small></button>
 <button data-u="rate">Faster fire<br><small>35 coins</small></button>
 <button data-u="health">Health +25<br><small>30 coins</small></button>
 </div>
 <button id="skip">START NEXT WAVE</button>`;
 document.querySelectorAll("[data-u]").forEach(b=>b.onclick=()=>{
   let u=b.dataset.u,cost=u==="damage"?25:u==="rate"?35:30;
   if(money<cost)return;
   money-=cost;if(u==="damage")damage+=10;if(u==="rate")fireDelay=Math.max(80,fireDelay-45);if(u==="health")hp=Math.min(100,hp+25);
   hud();b.disabled=true;
 });
 document.getElementById("skip").onclick=()=>{wave++;waveTime=0;spawn=0;running=true;document.querySelector("#overlay").style.display="none";last=performance.now();requestAnimationFrame(loop)}
}
function gameOver(){
 running=false;document.querySelector("#overlay").style.display="flex";
 document.querySelector("#overlay .panel").innerHTML=`<h1>GAME OVER</h1><p>You reached wave <b>${wave}</b> and got <b>${kills}</b> kills.</p><button id="again">PLAY AGAIN</button>`;
 document.getElementById("again").onclick=()=>startGame();
}
function update(dt,t){
 let dx=(keys.d?1:0)-(keys.a?1:0),dy=(keys.s?1:0)-(keys.w?1:0),len=Math.hypot(dx,dy)||1;
 player.x=Math.max(20,Math.min(W-20,player.x+dx/len*player.speed*dt));
 player.y=Math.max(20,Math.min(H-20,player.y+dy/len*player.speed*dt));
 if(mouse.down)shoot(t);
 spawn+=dt;
 let interval=Math.max(.25,1.0-wave*.035);
 if(spawn>interval){spawn=0;spawnEnemy()}
 for(let i=bullets.length-1;i>=0;i--){
  let b=bullets[i];b.x+=b.vx*dt;b.y+=b.vy*dt;
  if(b.x<-50||b.x>W+50||b.y<-50||b.y>H+50){bullets.splice(i,1);continue}
  for(let j=enemies.length-1;j>=0;j--){
   let e=enemies[j];
   if(Math.hypot(b.x-e.x,b.y-e.y)<b.r+e.r){
    e.hp-=b.d;bullets.splice(i,1);burst(b.x,b.y,2);
    if(e.hp<=0){money+=e.boss?20:5;kills++;burst(e.x,e.y,10);enemies.splice(j,1);hud()}
    break;
   }
  }
 }
 for(let i=enemies.length-1;i>=0;i--){
  let e=enemies[i],a=Math.atan2(player.y-e.y,player.x-e.x),d=Math.hypot(player.x-e.x,player.y-e.y);
  if(d>player.r+e.r){e.x+=Math.cos(a)*e.speed*dt;e.y+=Math.sin(a)*e.speed*dt}
  else{hp-=(e.boss?22:12)*dt;if(hp<=0){hp=0;hud();gameOver();return}}
 }
 for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;if(p.life<=0)particles.splice(i,1)}
 waveTime+=dt;
 if(waveTime>25&&!enemies.length)clearWave();
 hud();
}
function draw(){
 ctx.clearRect(0,0,W,H);ctx.fillStyle="#171717";ctx.fillRect(0,0,W,H);
 ctx.strokeStyle="#ffffff0a";for(let x=0;x<W;x+=50){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=0;y<H;y+=50){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
 ctx.beginPath();ctx.arc(player.x,player.y,52,0,Math.PI*2);ctx.fillStyle="#ffffff08";ctx.fill();
 for(const b of bullets){ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fillStyle="#fff";ctx.fill()}
 for(const e of enemies){
  ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,Math.PI*2);ctx.fillStyle=e.boss?"#bbb":"#777";ctx.fill();
  ctx.fillStyle="#222";ctx.fillRect(e.x-15,e.y-e.r-9,30,4);ctx.fillStyle="#eee";ctx.fillRect(e.x-15,e.y-e.r-9,30*(e.hp/e.max),4)
 }
 const a=Math.atan2(mouse.y-player.y,mouse.x-player.x);
 ctx.save();ctx.translate(player.x,player.y);ctx.rotate(a);ctx.fillStyle="#ddd";ctx.fillRect(6,-5,28,10);ctx.restore();
 ctx.beginPath();ctx.arc(player.x,player.y,player.r,0,Math.PI*2);ctx.fillStyle="#aaa";ctx.fill();ctx.strokeStyle="#fff";ctx.stroke();
 for(const p of particles){ctx.globalAlpha=Math.max(0,p.life/.35);ctx.fillStyle="#fff";ctx.fillRect(p.x-2,p.y-2,4,4)}ctx.globalAlpha=1;
}
function loop(t){if(!running)return;let dt=Math.min(.033,(t-last)/1000);last=t;update(dt,t);draw();if(running)requestAnimationFrame(loop)}
function startGame(){reset();document.querySelector("#overlay").style.display="none";running=true;last=performance.now();requestAnimationFrame(loop)}
document.getElementById("start").onclick=startGame;
draw();
</script>
</body>
</html>
